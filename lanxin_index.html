<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>应用授权导航（极速版）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            /* 去掉昂贵的 backdrop-filter，使用纯色半透明 + 细边框模拟玻璃效果 */
            background: rgba(255, 255, 255, 0.85);
            border-radius: 48px;
            padding: 48px 40px 56px;
            box-shadow: 0 20px 60px rgba(0,20,40,0.12), 0 8px 24px rgba(0,0,0,0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #0b1e33;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header h1 span { font-size: 2rem; } /* emoji 图标 */
        .header p { margin-top: 8px; color: #4a617c; font-size: 1.05rem; }
        .header .badge {
            display: inline-block;
            margin-top: 12px;
            background: rgba(42,125,225,0.12);
            color: #1a5fb4;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 18px;
            border-radius: 40px;
            border: 1px solid rgba(42,125,225,0.15);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 24px;
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 28px 16px 24px;
            text-align: center;
            text-decoration: none;
            color: #0b1e33;
            box-shadow: 0 4px 16px rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.04);
            /* 优化：只对 transform 做动画，避开重排/重绘 */
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 190px;
            will-change: transform;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px -8px rgba(0,30,60,0.18), 0 8px 20px rgba(0,0,0,0.04);
            border-color: rgba(42,125,225,0.25);
        }
        .card:active { transform: scale(0.96); transition-duration: 0.08s; }
        
        /* Emoji 图标大小 */
        .card .icon-emoji {
            font-size: 3.6rem;
            line-height: 1;
            margin-bottom: 14px;
            transition: transform 0.3s ease;
        }
        .card:hover .icon-emoji { transform: scale(1.12); }

        .card .title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 4px;
            color: #0b1e33;
        }
        .card .desc {
            font-size: 0.75rem;
            color: #8a9fb8;
            font-weight: 400;
            background: #f0f4f9;
            padding: 2px 12px;
            border-radius: 30px;
            max-width: 140px;
            margin: 0 auto;
            word-break: break-all;
        }
        .footer-note {
            margin-top: 40px;
            text-align: center;
            color: #7a8fa8;
            font-size: 0.85rem;
            border-top: 1px solid rgba(0,0,0,0.04);
            padding-top: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-note code {
            background: rgba(0,0,0,0.04);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #2a4a6a;
            font-family: 'Menlo', monospace;
        }
        @media (max-width: 700px) {
            .container { padding: 28px 16px 32px; border-radius: 32px; }
            .header h1 { font-size: 1.8rem; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
            .card { min-height: 160px; padding: 20px 12px 18px; }
            .card .icon-emoji { font-size: 3rem; }
        }
        @media (max-width: 420px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card { min-height: 140px; padding: 16px 8px 14px; }
            .card .icon-emoji { font-size: 2.6rem; margin-bottom: 8px; }
            .header h1 { font-size: 1.4rem; }
            .container { padding: 20px 12px 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span>📋</span> 应用授权导航</h1>
            <p>点击卡片，通过 OAuth 授权跳转至对应应用</p>
            <span class="badge">✏️ 共 <span id="countDisplay">0</span> 个应用</span>
        </div>

        <div class="grid" id="iconGrid"></div>

        <div class="footer-note">
            ✅ 授权地址统一使用 <code>user-stage.e.lanxin.cn</code>
            · ✏️ 修改 <code>apps</code> 数组即可扩展
        </div>
    </div>

    <script>
        // ================================================================
        //  应用数据（使用 Emoji 代替字体图标，零外部请求）
        // ================================================================
        const apps = [
            { path: '/meetingRoom',     title: '会议室',    emoji: '🏢' },
            { path: '/group',           title: '群组',      emoji: '👥' },
            { path: '/questionAnswer',  title: '问答',      emoji: '❓' },
            { path: '/feedback',        title: '反馈',      emoji: '💬' },
            { path: '/wage',            title: '工资',      emoji: '💰' },
            { path: '/noticeManagement',title: '公告管理',  emoji: '📢' },
            { path: '/mobileMeeting',   title: '移动会议',  emoji: '📱' },
            { path: '/visit',           title: '拜访',      emoji: '🤝' },
            { path: '/externalUser',    title: '外部用户',  emoji: '👤' },
            { path: '/tdTask',          title: '任务',      emoji: '✅' },
            { path: '/scheduleCalendar',title: '日程日历',  emoji: '📅' },
            { path: '/deviceRepair',    title: '设备维修',  emoji: '🔧' },
            { path: '/leave',           title: '请假',      emoji: '🏖️' },
            { path: '/clock',           title: '打卡',      emoji: '⏰' },
            { path: '/syncAssistant',   title: '同步助手',  emoji: '🔄' }
        ];

        // ================================================================
        //  构造授权链接
        // ================================================================
        const BASE_URL = 'https://user-stage.e.lanxin.cn/user/passport/oauth2/authorize';
        const APPID = '14803712-8601856';
        const REDIRECT_URI_PREFIX = 'http://localhost:3100/login?dir=roleSelection?key=';

        function buildAuthUrl(path) {
            const redirectUri = REDIRECT_URI_PREFIX + encodeURIComponent(path);
            const encodedRedirect = encodeURIComponent(redirectUri);
            return `${BASE_URL}?appid=${APPID}&response_type=code&scope=SCOPE&state=STATE&redirect_uri=${encodedRedirect}`;
        }

        apps.forEach(app => { app.url = buildAuthUrl(app.url || app.path); });

        // ================================================================
        //  渲染
        // ================================================================
        const grid = document.getElementById('iconGrid');
        const countDisplay = document.getElementById('countDisplay');

        function renderApps() {
            if (!apps.length) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#8a9fb8;">暂无数据</div>`;
                countDisplay.textContent = '0';
                return;
            }

            let html = '';
            apps.forEach(item => {
                // 防止 path 未定义
                const path = item.path || '/';
                html += `
                    <a class="card" href="${item.url}" target="_blank" rel="noopener noreferrer">
                        <div class="icon-emoji">${item.emoji || '📌'}</div>
                        <div class="title">${item.title || '未命名'}</div>
                        <div class="desc">${path}</div>
                    </a>
                `;
            });
            grid.innerHTML = html;
            countDisplay.textContent = apps.length;
        }

        renderApps();
        console.log('✅ 极速导航已加载，共 ' + apps.length + ' 个应用 (无外部依赖)');
    </script>
</body>
</html>
