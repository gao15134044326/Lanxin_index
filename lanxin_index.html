<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>应用授权导航</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* 样式与之前保持一致，仅微调颜色 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 48px 40px 56px;
            box-shadow: 0 20px 60px rgba(0,20,40,0.12), 0 8px 24px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #0b1e33;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header h1 i { color: #2a7de1; font-size: 2rem; }
        .header p { margin-top: 8px; color: #4a617c; font-size: 1.05rem; }
        .header .badge {
            display: inline-block;
            margin-top: 12px;
            background: rgba(42,125,225,0.12);
            color: #1a5fb4;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 18px;
            border-radius: 40px;
            border: 1px solid rgba(42,125,225,0.15);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 24px;
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 28px 16px 24px;
            text-align: center;
            text-decoration: none;
            color: #0b1e33;
            box-shadow: 0 4px 16px rgba(0,0,0,0.02);
            border: 1px solid rgba(255,255,255,0.7);
            transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease, border-color 0.25s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 190px;
            will-change: transform;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 40px -8px rgba(0,30,60,0.18), 0 8px 20px rgba(0,0,0,0.04);
            border-color: rgba(42,125,225,0.25);
        }
        .card:active { transform: scale(0.96); transition-duration: 0.08s; }
        .card .icon {
            font-size: 3.2rem;
            line-height: 1;
            margin-bottom: 14px;
            color: #2a7de1;
            transition: transform 0.3s ease, color 0.25s ease;
        }
        .card:hover .icon { transform: scale(1.08); color: #1a5fb4; }
        /* 颜色主题（与之前相同） */
        .card[data-color="green"] .icon { color: #1f9d6e; }
        .card[data-color="green"]:hover .icon { color: #137a55; }
        .card[data-color="purple"] .icon { color: #8b5cf6; }
        .card[data-color="purple"]:hover .icon { color: #7c3aed; }
        .card[data-color="orange"] .icon { color: #e67e22; }
        .card[data-color="orange"]:hover .icon { color: #d35400; }
        .card[data-color="red"] .icon { color: #e74c3c; }
        .card[data-color="red"]:hover .icon { color: #c0392b; }
        .card[data-color="teal"] .icon { color: #0ea5e9; }
        .card[data-color="teal"]:hover .icon { color: #0284c7; }
        .card[data-color="pink"] .icon { color: #ec4899; }
        .card[data-color="pink"]:hover .icon { color: #db2777; }
        .card[data-color="indigo"] .icon { color: #4f46e5; }
        .card[data-color="indigo"]:hover .icon { color: #4338ca; }
        .card[data-color="amber"] .icon { color: #f59e0b; }
        .card[data-color="amber"]:hover .icon { color: #d97706; }
        .card .title { font-weight: 600; font-size: 1.05rem; margin-bottom: 4px; color: #0b1e33; }
        .card .desc { font-size: 0.8rem; color: #6b7f96; font-weight: 400; line-height: 1.3; max-width: 140px; margin: 0 auto; }
        .footer-note {
            margin-top: 40px;
            text-align: center;
            color: #7a8fa8;
            font-size: 0.85rem;
            border-top: 1px solid rgba(0,0,0,0.04);
            padding-top: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-note i { color: #2a7de1; opacity: 0.6; }
        .footer-note code {
            background: rgba(0,0,0,0.04);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #2a4a6a;
            font-family: 'Menlo', monospace;
        }
        @media (max-width: 700px) {
            .container { padding: 28px 16px 32px; border-radius: 32px; }
            .header h1 { font-size: 1.8rem; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
            .card { min-height: 160px; padding: 20px 12px 18px; border-radius: 22px; }
            .card .icon { font-size: 2.6rem; }
            .card .title { font-size: 0.95rem; }
            .card .desc { font-size: 0.7rem; max-width: 110px; }
        }
        @media (max-width: 420px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card { min-height: 140px; padding: 16px 8px 14px; }
            .card .icon { font-size: 2.2rem; margin-bottom: 8px; }
            .header h1 { font-size: 1.4rem; }
            .container { padding: 20px 12px 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fa-regular fa-id-card"></i> 应用授权导航</h1>
            <p>点击卡片，通过 OAuth 授权跳转至对应应用</p>
            <span class="badge"><i class="fa-regular fa-pen-to-square" style="margin-right:6px;"></i> 共 <span id="countDisplay">0</span> 个应用</span>
        </div>

        <div class="grid" id="iconGrid"></div>

        <div class="footer-note">
            <i class="fa-regular fa-circle-check"></i> 授权地址统一使用
            <code>user-stage.e.lanxin.cn</code>
            <span style="opacity:0.3;margin:0 4px;">·</span>
            <i class="fa-regular fa-code"></i> 修改 <code>apps</code> 数组即可扩展
        </div>
    </div>

    <script>
        // ================================================================
        //  📌 应用数据 —— 根据 needScanApplication 列表生成
        //  每个对象：{ path, title, icon, color, url }
        // ================================================================
        const apps = [
            { path: '/meetingRoom',    title: '会议室',     icon: 'fa-regular fa-building',      color: 'teal' },
            { path: '/group',          title: '群组',       icon: 'fa-regular fa-users',          color: 'purple' },
            { path: '/questionAnswer', title: '问答',       icon: 'fa-regular fa-circle-question', color: 'orange' },
            { path: '/feedback',       title: '反馈',       icon: 'fa-regular fa-comment',        color: 'pink' },
            { path: '/wage',           title: '工资',       icon: 'fa-regular fa-money-bill-1',   color: 'green' },
            { path: '/noticeManagement', title: '公告管理', icon: 'fa-regular fa-bullhorn',       color: 'indigo' },
            { path: '/mobileMeeting',  title: '移动会议',   icon: 'fa-regular fa-phone',          color: 'red' },
            { path: '/visit',          title: '拜访',       icon: 'fa-regular fa-handshake',      color: 'amber' },
            { path: '/externalUser',   title: '外部用户',   icon: 'fa-regular fa-user-plus',      color: 'teal' },
            { path: '/tdTask',         title: '任务',       icon: 'fa-regular fa-list-check',     color: 'purple' },
            { path: '/scheduleCalendar', title: '日程日历', icon: 'fa-regular fa-calendar',       color: 'green' },
            { path: '/deviceRepair',   title: '设备维修',   icon: 'fa-regular fa-screwdriver-wrench', color: 'orange' },
            { path: '/leave',          title: '请假',       icon: 'fa-regular fa-calendar-check', color: 'red' },
            { path: '/clock',          title: '打卡',       icon: 'fa-regular fa-clock',          color: 'indigo' },
            { path: '/syncAssistant',  title: '同步助手',   icon: 'fa-regular fa-arrows-rotate',  color: 'pink' }
        ];

        // ================================================================
        //  构造授权链接
        //  模板：https://user-stage.e.lanxin.cn/user/passport/oauth2/authorize?appid=14803712-8601856&response_type=code&scope=SCOPE&state=STATE&redirect_uri=http://localhost:3100/login?dir=roleSelection?key=路径
        // ================================================================
        const BASE_URL = 'https://user-stage.e.lanxin.cn/user/passport/oauth2/authorize';
        const APPID = '14803712-8601856';
        const REDIRECT_URI_PREFIX = 'http://localhost:3100/login?dir=roleSelection?key=';

        function buildAuthUrl(path) {
            const redirectUri = REDIRECT_URI_PREFIX + encodeURIComponent(path); // 直接拼接，路径包含/，但可保留
            // 注意：原示例未对redirect_uri编码，但为了安全，我们整体构建
            // 这里直接拼接，浏览器会自动编码，但防止特殊字符，我们手动编码redirect_uri
            const encodedRedirect = encodeURIComponent(redirectUri);
            return `${BASE_URL}?appid=${APPID}&response_type=code&scope=SCOPE&state=STATE&redirect_uri=${encodedRedirect}`;
        }

        // 为每个应用生成完整URL
        apps.forEach(app => {
            app.url = buildAuthUrl(app.path);
        });

        // ================================================================
        //  渲染
        // ================================================================
        const grid = document.getElementById('iconGrid');
        const countDisplay = document.getElementById('countDisplay');

        function renderApps() {
            if (!apps.length) {
                grid.innerHTML = `<div class="grid-empty"><i class="fa-regular fa-circle-exclamation" style="font-size:2.4rem;display:block;margin-bottom:12px;color:#b0c8dd;"></i>暂无应用数据</div>`;
                countDisplay.textContent = '0';
                return;
            }

            let html = '';
            apps.forEach(item => {
                const colorAttr = item.color ? ` data-color="${item.color}"` : '';
                html += `
                    <a class="card" href="${item.url}" target="_blank" rel="noopener noreferrer"${colorAttr}>
                        <div class="icon"><i class="${item.icon}"></i></div>
                        <div class="title">${item.title}</div>
                        <div class="desc">${item.path}</div>
                    </a>
                `;
            });
            grid.innerHTML = html;
            countDisplay.textContent = apps.length;
        }

        renderApps();

        // 暴露到控制台方便调试
        console.log('✅ 应用导航已加载，共 ' + apps.length + ' 个');
        console.log('💡 修改 apps 数组后执行 renderApps() 刷新');
    </script>
</body>
</html>
